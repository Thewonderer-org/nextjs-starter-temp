apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{cookiecutter.app_name}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{cookiecutter.app_name}}
  template:
    metadata:
      labels:
        app: {{cookiecutter.app_name}}
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo:latest
        args:
          - "-text=Hello from {{cookiecutter.app_name}}! Deployed via Harness IDP. Owner: {{cookiecutter.owner}}"
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: {{cookiecutter.app_name}}
spec:
  selector:
    app: {{cookiecutter.app_name}}
  ports:
  - port: 80
    targetPort: 5678
  type: LoadBalancer
